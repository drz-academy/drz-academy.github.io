name: Backup form responses

on:
  schedule:
    # 12:50 UTC = 7:50 AM COT, antes del backup de analytics y del deploy
    - cron: '50 12 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download evaluation CSV
        env:
          CLUB_ADMIN_TOKEN: ${{ secrets.CLUB_ADMIN_TOKEN }}
          CLUB_ADMIN_MASTER: ${{ secrets.CLUB_ADMIN_MASTER }}
          CLUB_WORKER_URL: ${{ secrets.CLUB_WORKER_URL }}
        run: python3 club/client/export_forms.py --csv-repo --no-json

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add club/drz-forms/*-respuestas.csv || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: backup respuestas de evaluación" && git push)
